name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: main
    steps:
      # @intelena/shielded-notes is consumed via file:../../../shielded-notes until it is on npm,
      # so check both repos out as siblings.
      - uses: actions/checkout@v4
        with:
          path: main
      - uses: actions/checkout@v4
        with:
          repository: intelena/shielded-notes
          path: shielded-notes
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build shielded-notes
        working-directory: shielded-notes
        run: pnpm install --frozen-lockfile && pnpm build
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
